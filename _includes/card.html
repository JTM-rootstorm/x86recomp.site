<a class="card" href="{{ include.p.url | relative_url }}">
  <h3>{{ include.p.title }}</h3>
  <p class="game">{{ include.p.game }} ({{ include.p.year }}{% if include.p.arch %}, {{ include.p.arch }}{% endif %})</p>
  <span class="badge badge-{{ include.p.stage }}">{{ include.p.status }}</span>
  <p class="summary">{{ include.p.summary }}</p>
</a>
